<style>
/* ---- Value Chain animation: page-scoped design tokens (namespaced, no collisions with site vars) ---- */
:root{
--color-background:#1A1A1A;
--color-surface:#232120;

--color-text-primary:#FFFFFF;

--color-cyan:#00B6CC;
--surface-card:var(--color-surface);
--border-card:var(--color-surface-border);
--text-body:var(--color-text-primary);
--text-body-muted:var(--color-text-muted);
--accent-resting:var(--color-teal);
--accent-hover:var(--color-cyan);
}
:root{
--font-display:'Montserrat','Helvetica Neue',Arial,sans-serif;
--font-body:'Open Sans','Helvetica Neue',Arial,sans-serif;
--text-h1:40px;

--weight-display:600;

--weight-body-strong:600;
--leading-heading:1.2;

--tracking-eyebrow:0.12em;
--tracking-wordmark-sub:0.04em;
}
:root{
--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;
--space-6:24px;--space-7:28px;--space-8:32px;--space-9:36px;--space-10:40px;

}

html,body{margin:0;padding:0;background:#1A1A1A;overflow:hidden;height:100%;}

#chain-stage-wrap {
  width: 100%;
  height: 100%;
}
#root {
  position: relative;
  width: 100%;
  height: 100%;
  background: #1A1A1A;
  overflow: hidden;
}
@keyframes om-pulse { 0%,100%{ transform:scaleY(0.6); opacity:0.35 } 50%{ transform:scaleY(1.15); opacity:0.85 } }

/* The engine's own playback chrome (play/pause, scrub bar, video-export
   button) is authoring/debug UI meant to be suppressed whenever a host
   editor is present. There is no host here, so hide it outright. */
[data-omelette-chrome]{display:none !important;}
</style>
</head>

<script>

  // one localStorage key across every instance on the site).
  try { localStorage.removeItem('animstage:t'); } catch (e) {}

<div id="chain-stage-wrap">
